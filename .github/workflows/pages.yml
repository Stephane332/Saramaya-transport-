# Publie la version web de l'application sur GitHub Pages.
#
#     https://stephane332.github.io/Saramaya-transport-/
#
# Le résultat est une adresse ouvrable depuis n'importe quel téléphone, sans
# ordinateur allumé et sans passer par les stores.
#
# ## Historique, pour qui reprendrait ce fichier
#
# Ce workflow a longtemps tourné dans le vide : 51 exécutions, 51 échecs, toujours
# le même 404 sur `deploy-pages`. La cause n'était pas dans le fichier — Pages
# n'était pas activé sur le dépôt, et ne pouvait pas l'être, un dépôt privé exigeant
# un abonnement payant. Il a donc été mis en déclenchement manuel : une croix rouge à
# chaque envoi, et l'illusion qu'une version web existait quelque part, coûtaient plus
# que le service rendu.
#
# **Le dépôt est désormais public**, et la voie est ouverte. Le déclenchement
# automatique revient.
#
# ## Une condition qui ne dépend pas de ce fichier
#
# `Settings → Pages → Source : « GitHub Actions »`, à faire **une fois**. Sans ce
# réglage, la construction réussit et la publication échoue avec un 404 — c'est
# exactement ce qui s'est passé 51 fois.
#
# ## Ce que la publicité du dépôt implique
#
# Tout ce qui est ici se lit désormais sans compte, `docs/presentation/` compris.
# Ces notes sont écrites pour préparer un rendez-vous, pas pour être lues par la
# compagnie. Ce qui ne doit pas être public doit être **retiré du dépôt et de son
# historique**, pas seulement de la dernière version.

name: Publier la version web

on:
  push:
    branches: [claude/salut-t175hl, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier
        # `npm run verifier` et non `tsc` + `npm test` séparés : la vérification qui
        # garde une publication doit être celle qu'on lance en local, pas une
        # version allégée. Elle ajoute la régénération des types de routes — sans
        # laquelle `tsc` ne dit pas la même chose ici et sur la machine du
        # développeur — et les 22 invariants, dont ceux qui tiennent la règle du
        # billet. Publier sans eux, c'est publier sans filet.
        run: npm run verifier

      - name: Construire la version web
        # Le site est servi depuis un sous-dossier : sans ce préfixe, tous les
        # chemins vers /_expo/... pointeraient à la racine du domaine.
        #
        # `--clear` n'est pas décoratif : Metro fige la valeur des variables
        # `EXPO_PUBLIC_*` dans ses modules transformés, et un cache réutilisé a déjà
        # produit un paquet voyageur contenant les écrans du personnel.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist --clear

      - name: Préparer pour l'hébergement statique
        # Balises d'installation sur l'écran d'accueil, repli des liens profonds
        # en 404.html, et .nojekyll pour que le dossier _expo ne soit pas ignoré.
        run: node scripts/preparer-pages.mjs dist "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Que faire si la publication a échoué
        # Cette étape ne s'exécute que sur échec. Le cas de loin le plus fréquent
        # est une erreur 404 : la construction a réussi, mais GitHub Pages n'a
        # jamais été activé sur le dépôt. Autant le dire ici plutôt que de laisser
        # chercher dans les journaux.
        if: failure()
        run: |
          echo "::error::Publication impossible. Si le message ci-dessus est une erreur 404,"
          echo "::error::activez GitHub Pages : Settings -> Pages -> Source : « GitHub Actions »,"
          echo "::error::puis relancez ce workflow. La construction, elle, a réussi."
          exit 1
