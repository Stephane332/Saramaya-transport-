# Publie la version web de l'application sur GitHub Pages.
#
# Le résultat est une adresse ouvrable depuis un téléphone, sans ordinateur et sans
# passer par les stores — pratique pour montrer le projet.
#
# À activer une seule fois : Settings → Pages → Source : « GitHub Actions ».
# Tant que ce réglage n'est pas fait, ce workflow ne publie rien.

name: Publier la version web

on:
  push:
    branches: [claude/salut-t175hl, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Construire la version web
        # Les chemins doivent être relatifs : le site est servi depuis un sous-dossier.
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Éviter le traitement Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
