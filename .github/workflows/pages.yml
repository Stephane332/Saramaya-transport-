# Publie la version web sur GitHub Pages — **hors service, et volontairement**.
#
# Ce workflow ne se déclenche plus tout seul. Il a tourné 51 fois, il a échoué 51
# fois, toujours au même endroit : `deploy-pages` répond 404 parce que GitHub Pages
# n'est pas activé sur ce dépôt — et il ne peut pas l'être. Pages sur dépôt privé
# exige un abonnement payant, et **rendre le dépôt public n'est pas une option** :
# l'historique contient l'argumentaire de vente et la note sur les failles de la
# compagnie, qui deviendraient lisibles par elle avant le premier rendez-vous.
#
# Le coût de le laisser se déclencher n'était pas nul : une croix rouge à chaque
# envoi, et surtout l'illusion qu'une version web était publiée quelque part. Elle
# ne l'était pas — l'adresse ci-dessous n'a jamais rien servi.
#
#     https://stephane332.github.io/Saramaya-transport-/   (404)
#
# **La voie qui marche est `eas deploy --prod`** (`npm run web:publier`) : elle
# publie chez Expo depuis un code qui reste privé. Voir `docs/feuille-de-route.md`.
#
# Ce fichier est conservé, prêt à servir, pour le jour où le dépôt deviendra public
# ou le compte passera à une formule payante. Pour l'essayer : onglet Actions →
# « Publier la version web » → Run workflow, après avoir fait
# Settings → Pages → Source : « GitHub Actions ».

name: Publier la version web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier
        # `npm run verifier` et non `tsc` + `npm test` séparés : la vérification qui
        # garde une publication doit être celle qu'on lance en local, pas une
        # version allégée. Elle ajoute la régénération des types de routes — sans
        # laquelle `tsc` ne dit pas la même chose ici et sur la machine du
        # développeur — et les 22 invariants, dont ceux qui tiennent la règle du
        # billet. Publier sans eux, c'est publier sans filet.
        run: npm run verifier

      - name: Construire la version web
        # Le site est servi depuis un sous-dossier : sans ce préfixe, tous les
        # chemins vers /_expo/... pointeraient à la racine du domaine.
        #
        # `--clear` n'est pas décoratif : Metro fige la valeur des variables
        # `EXPO_PUBLIC_*` dans ses modules transformés, et un cache réutilisé a déjà
        # produit un paquet voyageur contenant les écrans du personnel.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist --clear

      - name: Préparer pour l'hébergement statique
        # Balises d'installation sur l'écran d'accueil, repli des liens profonds
        # en 404.html, et .nojekyll pour que le dossier _expo ne soit pas ignoré.
        run: node scripts/preparer-pages.mjs dist "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Que faire si la publication a échoué
        # Cette étape ne s'exécute que sur échec. Le cas de loin le plus fréquent
        # est une erreur 404 : la construction a réussi, mais GitHub Pages n'a
        # jamais été activé sur le dépôt. Autant le dire ici plutôt que de laisser
        # chercher dans les journaux.
        if: failure()
        run: |
          echo "::error::Publication impossible. Si le message ci-dessus est une erreur 404,"
          echo "::error::activez GitHub Pages : Settings -> Pages -> Source : « GitHub Actions »,"
          echo "::error::puis relancez ce workflow. La construction, elle, a réussi."
          exit 1
