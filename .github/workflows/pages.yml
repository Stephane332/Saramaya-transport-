# Publie la version web de l'application sur GitHub Pages.
#
# Le résultat est une adresse ouvrable depuis un téléphone, sans ordinateur et sans
# passer par les stores :
#
#     https://stephane332.github.io/Saramaya-transport-/
#
# À activer une seule fois : Settings → Pages → Source : « GitHub Actions ».
# Tant que ce réglage n'est pas fait, le job de publication échoue sans rien casser.

name: Publier la version web

on:
  push:
    branches: [claude/salut-t175hl, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Construire la version web
        # Le site est servi depuis un sous-dossier : sans ce préfixe, tous les
        # chemins vers /_expo/... pointeraient à la racine du domaine.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist

      - name: Préparer pour l'hébergement statique
        # Balises d'installation sur l'écran d'accueil, repli des liens profonds
        # en 404.html, et .nojekyll pour que le dossier _expo ne soit pas ignoré.
        run: node scripts/preparer-pages.mjs dist "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
